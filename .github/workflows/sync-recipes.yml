name: Sync recipes from Notion

on:
  workflow_dispatch:       # manual trigger from GitHub UI
  repository_dispatch:     # trigger via GitHub API (POST /repos/saintsaens/bouffeo/dispatches)

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: node scripts/fetch-recipes.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet src/data/recipes.json || (
            git add src/data/recipes.json &&
            git commit -m "sync recipes from Notion" &&
            git push
          )
